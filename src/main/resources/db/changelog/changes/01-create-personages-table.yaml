databaseChangeLog:
  - changeSet:
      id: create-personages-table
      author: acor
      changes:
        - createTable:
            tableName: personages
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: external_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: varchar(64)
                  constraints:
                    nullable: false
